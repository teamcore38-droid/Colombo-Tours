<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colombo Tours — Luxury Car Rental &amp; Chauffeur Services in Sri Lanka</title>
    <meta
      name="description"
      content="Experience Sri Lanka in unrivaled luxury. Browse Colombo Tours’ curated fleet of luxury sedans, SUVs, wedding cars, and chauffeur-driven vehicles and enquire instantly via WhatsApp."
    />
    <meta name="theme-color" content="#0A0A0D" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>(function(){try{var s=localStorage.getItem('colombo-tours-theme'),t=s==='light'?'light':'dark',r=document.documentElement;r.classList.toggle('dark',t==='dark');r.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0A0A0D':'#F7F5F0');}catch(e){document.documentElement.classList.add('dark');}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
